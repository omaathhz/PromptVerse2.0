function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(file)})}
async function mnAddFiles(files){
  let total=MN.files.reduce((a,f)=>a+f.data.length,0);const pals=[];
  for(const f of files){
    if(MN.files.length>=8){toast('Máximo de 8 arquivos.','err');break}
    try{
      if(f.type==='application/pdf'){if(f.size>7e6){toast(`O PDF ${f.name} passa de 7 MB. Envie fotos das páginas.`,'err');continue}
        const u=await toB64(f);MN.files.push({name:f.name,mime:'application/pdf',data:u.split(',')[1],thumb:''});total+=u.length}
      else if(f.type.startsWith('image/')){const {url,canvas}=await readImg(f,1600,.82);MN.files.push({name:f.name,mime:'image/jpeg',data:url.split(',')[1],thumb:url});pals.push(canvas);total+=url.length}
    }catch{toast(`Não consegui ler ${f.name}.`,'err')}
  }
  if(total>9.5e6)toast('Os arquivos estão bem grandes; se a leitura falhar, envie menos páginas.','err');
  if(pals.length){const pal=paletteFrom(pals);if(pal.length){const m=MN.m;m.palette=pal;const vivid=[...pal].sort((x,y)=>{const s=h=>{const [r,g,b]=hexToRgb(h);return Math.max(r,g,b)-Math.min(r,g,b)};return s(y)-s(x)});m.c1=vivid[0];m.c2=vivid.find(x=>colorDist(x,m.c1)>90)||pal[1]||m.c2;
    const avgL=pal.slice(0,3).reduce((a,c)=>a+lum(c),0)/Math.min(3,pal.length);m.dark=avgL<.35}}
  MN.err='';render();
}
async function mnRead(){
  if(!MN.files.length)return;if(!sb){toast('Sem conexão com o Supabase.','err');return}
  const {data}=await sb.auth.getSession();const token=data&&data.session&&data.session.access_token;if(!token){toast('Entre novamente.','err');return}
  MN.reading=true;MN.err='';MN.done=null;const job=newJobId();jobRemember('cardapio',{id:job});mnLiveStart();render();
  try{
    let j={};
    try{
      const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),140000);
      const res=await fetch(CFG.supabaseUrl+'/functions/v1/cardapio-ia',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,apikey:CFG.supabaseAnonKey},body:JSON.stringify({files:MN.files.map(f=>({mime:f.mime,data:f.data})),job}),signal:ctrl.signal});
      try{j=await res.json()}catch{}
      if(!res.ok||j.error)throw Object.assign(new Error(res.status===404?'A função “cardapio-ia” ainda não foi publicada no Supabase.':(j.error||`Erro ${res.status}`)),{http:true});
    }catch(e){
      if(e.http)throw e;
      // conexão caiu (app em segundo plano): a leitura pode ter terminado no servidor
      const w=await jobWait(job,150000);
      if(w&&w.status==='pronto'&&w.resultado)j={menu:w.resultado};else throw e;
    }
    jobForget('cardapio');mnApply(j.menu||{});
  }catch(e){jobForget('cardapio');MN.reading=false;MN.err=e.name==='AbortError'?'A leitura demorou demais. Tente com menos páginas.':e.http?String(e.message||e):'A conexão caiu antes da leitura terminar. Tente de novo.';render()}
}
function mnApply(r){
    const m=MN.m;if(!m)return;
    if(!m.name&&r.name)m.name=r.name;
    if(r.type){const t=MENU_TYPES.find(x=>norm(x).startsWith(norm(r.type).slice(0,4)));if(t)m.type=t}
    const col=r.colors||{};const hex=v=>/^#[0-9a-f]{6}$/i.test(String(v||''))?String(v).toLowerCase():'';
    if(!m.palette.length){if(hex(col.primary))m.c1=hex(col.primary);if(hex(col.accent))m.c2=hex(col.accent);if(typeof col.dark==='boolean')m.dark=col.dark;m.palette=[hex(col.primary),hex(col.accent),hex(col.background)].filter(Boolean)}
    const inf=r.info||{};['whatsapp','instagram','address','hours','delivery'].forEach(k=>{if(!m[k]&&inf[k])m[k]=String(inf[k])});
    const cats=(r.categories||[]).map(c=>({id:mnId('c'),name:String(c.name||'Itens'),items:(c.items||[]).map(it=>({id:mnId('i'),name:String(it.name||''),desc:String(it.desc||''),price:mnPrice(it.price),tag:String(it.tag||'')})).filter(i=>i.name)})).filter(c=>c.items.length);
    if(!cats.length){MN.reading=false;MN.err='A IA não encontrou itens nesses arquivos. Tente fotos mais nítidas.';render();return}
    const onlyEmpty=m.cats.length===1&&!m.cats[0].items.some(i=>i.name);
    m.cats=onlyEmpty?cats:[...m.cats,...cats];
    MN.reading=false;MN.dirty=true;MN.done={cats:m.cats.map(c=>({name:c.name,items:c.items.filter(i=>i.name)})),items:mnCount(m)};render();
    if(innerWidth<900)setTimeout(()=>{const st=$('#mn-stage');st&&st.scrollIntoView({behavior:'smooth',block:'start'})},80);
    setTimeout(()=>{MN.done=null;if(S.route.page==='cardapios')render()},4200);
    toast(`Pronto! ${mnCount(m)} itens em ${m.cats.length} categorias. Confira e toque em Salvar.`);
}

    const old=m.saleId&&S.sales.find(x=>x.id===m.saleId);

    else{const paid=/^\d{4}-\d{2}-\d{2}$/.test(bl.paid||'')?bl.paid:today();const sid=nid('s');
      await Store.put('sales',{id:sid,clientName:m.name,service:'Cardápio digital',amount:amt,saleDate:paid,deliveryDate:'',status:'Entregue',payment:'Pix',link:mnUrl(m.id),notes:'Mensalidade do cardápio digital.',recurring:{active:true,amount:amt,day:+paid.slice(8)||10,start:ymAdd(paid.slice(0,7),1),payment:'Pix',payments:{}},createdAt:Date.now()});
      m.saleId=sid}
  }else if(m.saleId){const old=S.sales.find(x=>x.id===m.saleId);if(old&&old.recurring&&old.recurring.active)await Store.put('sales',{...old,recurring:{...old.recurring,active:false}})}
  m.updatedAt=Date.now();m.published=true;
  const clean={...m,bill:undefined,cats:m.cats.map(c=>({...c,items:c.items.filter(i=>i.name.trim())})).filter(c=>c.name.trim()||c.items.length)};
  const ok=await Store.put('cardapios',clean);

  return true;
}
function qrSvg(text,px=260){
  if(!window.qrcode)return `<p class="err">Gerador de QR Code não carregou. Recarregue a página.</p>`;
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();const cell=px/(n+4);let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${((c+2)*cell).toFixed(2)} ${((r+2)*cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`;

/* ---------- Fotos, paleta e animações do Agente ---------- */
const SITE_ANIMS=[['reveal','Surgir ao rolar'],['hover','Cards que sobem'],['zoom','Zoom nas fotos'],['glow','Botões com brilho'],['parallax','Parallax no topo'],['gradient','Gradiente animado'],['typing','Título digitando'],['marquee','Faixa de serviços correndo'],['slider','Carrossel de fotos'],['tilt','Efeito 3D nos cards']];
function readImg(file,max=1280,q=.78){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res({url:c.toDataURL('image/jpeg',q),canvas:c})};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u});
}
function rgbHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function colorDist(a,b){const [r1,g1,b1]=hexToRgb(a),[r2,g2,b2]=hexToRgb(b);return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2)}
/* Encontra as cores principais de vários prints (ignora o branco/preto da interface do Instagram) */
function paletteFrom(canvases){
  const buckets=new Map();
  canvases.forEach(src=>{const c=document.createElement('canvas');const w=120,h=Math.round(120*src.height/src.width)||120;c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(src,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;
    for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const l=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));
      if(l>242||l<14)continue;const key=(r>>4)+'-'+(g>>4)+'-'+(b>>4);const e=buckets.get(key)||{r:0,g:0,b:0,n:0,s:0};e.r+=r;e.g+=g;e.b+=b;e.n++;e.s+=sat;buckets.set(key,e)}});
  const list=[...buckets.values()].map(e=>({hex:rgbHex(e.r/e.n,e.g/e.n,e.b/e.n),n:e.n,s:e.s/e.n})).map(e=>({...e,score:e.n*(0.35+e.s*1.6)})).sort((a,b)=>b.score-a.score);
  const out=[];for(const e of list){if(out.every(o=>colorDist(o,e.hex)>70))out.push(e.hex);if(out.length>=6)break}
  return out;
}
async function agUpload(id,files){
  agCollect();const b=AG.brief;const lim={gallery:10,testis:8,ba:5};
  try{
    if(id==='ag-igp'){
      const cs=[];for(const f of files.slice(0,6)){try{cs.push((await readImg(f,600)).canvas)}catch{}}
      const pal=paletteFrom(cs);if(!pal.length){toast('Não consegui achar cores nesses prints.','err');return}
      b.palette=pal;b.colorMode='custom';const vivid=[...pal].sort((x,y)=>{const s=h=>{const [r,g,bb]=hexToRgb(h);return Math.max(r,g,bb)-Math.min(r,g,bb)};return s(y)-s(x)});
      b.c1=vivid[0];b.c2=vivid.find(x=>colorDist(x,b.c1)>90)||pal[1]||b.c2;render();toast('Paleta copiada dos prints! Toque numa cor para trocar a principal.');return}
    if(id==='ag-ba'){
      const {url}=await readImg(files[0],1100);
      if(!AG.baA){AG.baA=url;render();toast('Agora escolha a foto DEPOIS.');return}
      if((b.ba||[]).length>=lim.ba){toast(`Máximo de ${lim.ba} pares.`,'err');AG.baA=null;render();return}
      b.ba=[...(b.ba||[]),{a:AG.baA,b:url}];AG.baA=null;render();toast('Par de antes e depois adicionado.');return}
    const k=id==='ag-gal'?'gallery':'testis';const cur=b[k]||[];
    const room=lim[k]-cur.length;if(room<=0){toast(`Máximo de ${lim[k]} imagens aqui.`,'err');return}
    const out=[];for(const f of files.slice(0,room)){try{out.push((await readImg(f,k==='testis'?1000:1280)).url)}catch{}}
    b[k]=[...cur,...out];render();if(files.length>room)toast(`Adicionei ${room}. O máximo é ${lim[k]}.`);
  }catch{toast('Não foi possível ler esta imagem.','err')}
}
/* Imagens viram marcadores para a IA e são colocadas no site depois */
function agImgMap(b){
  const m={};(b.gallery||[]).forEach((u,i)=>m[`IMG_FOTO_${i+1}`]=u);(b.ba||[]).forEach((p,i)=>{m[`IMG_ANTES_${i+1}`]=p.a;m[`IMG_DEPOIS_${i+1}`]=p.b});(b.testis||[]).forEach((u,i)=>m[`IMG_DEPOIMENTO_${i+1}`]=u);return m;
}
function agImgFill(html,b){const m=agImgMap(b);Object.keys(m).sort((x,y)=>y.length-x.length).forEach(k=>{html=html.split(k).join(m[k])});return html}
function agAnimText(b){const a=b.anims||[];if(!a.length)return 'Sem animações (site estático e rápido).';return a.map(k=>({reveal:'elementos surgem suavemente ao rolar a página',hover:'cards sobem levemente com sombra ao passar o mouse',zoom:'fotos dão zoom suave ao passar o mouse',glow:'botões principais com brilho pulsante',parallax:'efeito parallax no topo (fundo se move mais devagar que o conteúdo)',gradient:'fundos com gradiente animado em movimento lento',typing:'título principal aparece digitando',marquee:'faixa com os serviços passando continuamente',slider:'galeria em carrossel deslizante automático',tilt:'cards com leve efeito 3D seguindo o mouse'}[k])).filter(Boolean).map(x=>'- '+x).join('\n')}
async function agImgZip(){
  const b=AG.brief;const m=agImgMap(b);const keys=Object.keys(m);if(!keys.length&&!b.logo){toast('Nenhuma imagem enviada ainda.','err');return}
  const ent=[];if(b.logo)ent.push({name:'00-logo.png',blob:await (await fetch(b.logo)).blob()});
  let i=1;for(const k of keys){ent.push({name:String(i++).padStart(2,'0')+'-'+k.toLowerCase().replace('img_','')+'.jpg',blob:await (await fetch(m[k])).blob()})}
  saveBlob(agSlug()+'-imagens.zip',await makeZip(ent));toast('Imagens baixadas na ordem. Anexe junto com o prompt.');
}

const AG_TARGETS=[['bolt','Bolt.new','https://bolt.new'],['lovable','Lovable','https://lovable.dev'],['claude','Claude','https://claude.ai/new'],['v0','v0','https://v0.dev'],['chatgpt','ChatGPT','https://chatgpt.com'],['gemini','Gemini','https://gemini.google.com']];
const AG_IMGS=[['logo','Logo'],['fachada','Fachada'],['equipe','Equipe / profissional'],['servicos','Fotos dos serviços'],['ambiente','Ambiente interno'],['produtos','Produtos'],['antesdepois','Antes e depois']];

function agPromptText(){
  const b=AG.brief;const n=nicheById(b.niche);const st=SITE_STYLES[b.style]||SITE_STYLES.escuro;const off=offer();
  const wa=waNumber(b.whatsapp||b.phone);const L=v=>String(v||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean);
  const services=L(b.services).length?L(b.services):n.services;const diffs=L(b.diffs);

    lovable:'Use React + Tailwind CSS (padrão do Lovable). Componentize as seções e deixe tudo responsivo.',
    v0:'Use Next.js (App Router) + Tailwind CSS + shadcn/ui.',
    claude:'Entregue um único arquivo index.html completo, com CSS e JavaScript embutidos, em um artifact, pronto para publicar. Pode usar Google Fonts; nada de frameworks.',

    gemini:'Entregue um único arquivo index.html completo, com CSS e JavaScript embutidos, pronto para publicar. Pode usar Google Fonts; nada de frameworks.'}[target];
  const type={site:'um site institucional completo (one-page) moderno e profissional',landing:'uma landing page de alta conversão',bio:'uma página de links para a bio do Instagram (estilo link na bio), bonita e rápida',cardapio:'um cardápio digital acessado por QR code'}[AG.pType];
  const secNames=Object.fromEntries(SITE_SECTIONS);
  const secs=AG.pType==='bio'?['Topo com logo, nome e frase curta','Botões grandes: WhatsApp, Instagram, Localização (Google Maps), Serviços','Destaque do serviço principal','Rodapé simples']

    :['Cabeçalho fixo com logo e botão “Falar no WhatsApp” (menu sanfona no celular)','Hero com título forte, subtítulo citando a cidade e dois botões (WhatsApp e Ver serviços)',...(b.sections||[]).filter(k=>k!=='hero'&&k!=='contato').map(k=>secNames[k]).filter(Boolean),'Chamada final + rodapé com contatos','Botão flutuante de WhatsApp'];
  const up=[];if(b.logo)up.push('logo da empresa — use no cabeçalho, no rodapé e como ícone');(b.gallery||[]).forEach((_,i)=>up.push(`foto da empresa ${i+1} — ${i===0?'use no hero (topo), com sobreposição para o texto ficar legível':i===1?'use na seção sobre':'use na galeria'}`));(b.ba||[]).forEach((_,i)=>{up.push(`ANTES ${i+1} — par com a próxima imagem`);up.push(`DEPOIS ${i+1} — monte um comparador deslizante antes/depois na seção “Resultados”`)});(b.testis||[]).forEach((_,i)=>up.push(`print de depoimento real ${i+1} — mostre na seção “O que nossos clientes dizem”, em cards estilo mural`));
  const imgs=(up.length?up:AG.imgs.map(k=>AG_IMG_USE[k])).map((x,i)=>`${i+1}. ${x}`);
  const colors=(b.palette||[]).length?`${b.c1} (principal), ${b.c2} (destaque) — paleta copiada do Instagram da empresa: ${b.palette.join(', ')}`:b.colorMode==='custom'?`${b.c1} (principal) e ${b.c2} (destaque)`:`${n.colors[0]} (principal), ${n.colors[1]} (destaque) e fundo ${st.dark?'escuro':n.colors[2]}`;
  return `Crie ${type} para a empresa abaixo. ${tech}

- WhatsApp: ${b.whatsapp||b.phone||'[WHATSAPP]'}${wa?` → todos os botões de ação devem abrir https://wa.me/${wa}?text= com uma mensagem pronta`:''}${b.instagram?`\n- Instagram: @${String(b.instagram).replace('@','')} (https://instagram.com/${String(b.instagram).replace('@','')})`:''}${b.email?`\n- E-mail: ${b.email}`:''}${b.hours?`\n- Horário: ${b.hours}`:''}${b.rating?`\n- Nota no Google: ${String(b.rating).replace('.',',')}${b.reviews?` (${b.reviews} avaliações)`:''}${b.googleUrl?` — link: ${b.googleUrl}`:''}`:''}
- Público: ${b.audience||`${n.who} da região`}

## Textos
- Frase principal (título do hero): ${b.slogan||n.hero}
- Objetivo do site: gerar ${n.gain}
${b.about?`- Sobre a empresa: ${b.about}\n`:''}- Serviços:
${services.map(x=>`  - ${x}`).join('\n')}
${diffs.length?`- Diferenciais:\n${diffs.map(x=>`  - ${x}`).join('\n')}\n`:''}- Perguntas frequentes:
${n.faq.map(f=>`  - ${f[0]} → ${f[1]}`).join('\n')}

## Seções (nesta ordem)

  for(let i=1;i<=steps&&AG.sim;i++){await delay(95);const part=html.slice(0,size*i);AG.raw=part;agLive(part,true);

async function agPro(b,brief,token){

/* Junta a continuação ao texto anterior sem repetir o pedaço que a IA reescreveu */
function agJoinPart(prev,more){
  let m=String(more||'').replace(/^\s*```html\s*/i,'').replace(/```\s*$/,'');
  if(/^\s*(<!doctype html|<html)/i.test(m))return m;
  const tail=prev.slice(-600);
  for(let n=Math.min(tail.length,m.length,400);n>=12;n--){if(tail.endsWith(m.slice(0,n)))return m.slice(n)}
  const t=m.trimStart();for(let n=Math.min(tail.length,t.length,400);n>=12;n--){if(tail.endsWith(t.slice(0,n)))return t.slice(n)}
  return m;
}

function edParse(html){

}

}

async function edSave(pub){
  const s=edSite();if(!s)return;edSend({t:'commit'});await new Promise(r=>setTimeout(r,60));
  const html=edOut();let versions=[{at:s.editedAt||s.createdAt||Date.now(),html:s.html},...(s.versions||[])];
  while(versions.length>1&&versions.reduce((a,v)=>a+(v.html||'').length,0)>2.5e6)versions.pop();versions=versions.slice(0,3);
  const ns={...s,html,versions,editedAt:Date.now()};
  ED.busy=true;edBar();const ok=await Store.put('sites',ns);ED.busy=false;
  if(ok===false){toast('Não consegui salvar agora. Confira a internet e tente de novo.','err');edBar();return}
  ED.dirty=false;if(AG.siteId===s.id)AG.html=html;
  if(pub&&pubOf(ns))await hsPublish(ns);else toast('Site salvo.');
  edBar();
}

async function onSiteAct(el){

const ymAdd=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return `${MONTHS_FULL[m-1]} de ${y}`};
const ymShort=ym=>{const [y,m]=ym.split('-').map(Number);return `${MONTHS[m-1]}/${String(y).slice(2)}`};
function recDueDate(r,ym){const [y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();return `${ym}-${pad(Math.min(Math.max(1,+r.day||1),last))}`}
function recInfo(s){
  const r=s&&s.recurring;if(!r||!r.active||!r.start||!(+r.amount>0))return null;
  const pays=r.payments||{};const t=today(),cur=t.slice(0,7);
  const overdue=[];for(let ym=r.start,i=0;ym<=cur&&i<120;ym=ymAdd(ym,1),i++){if(!pays[ym]&&recDueDate(r,ym)<t)overdue.push(ym)}
  let ym=r.start>cur?r.start:cur;for(let i=0;i<60&&(pays[ym]||recDueDate(r,ym)<t);i++)ym=ymAdd(ym,1);
  const next=recDueDate(r,ym),days=diffDays(t,next);
  const target=overdue[0]||ym,targetDue=recDueDate(r,target);
  const late=overdue.length?diffDays(targetDue,t):0;
  return {s,r,overdue,nextYm:ym,next,days,target,targetDue,late,paidCur:!!pays[cur],
    state:overdue.length?'late':days===0?'today':days<=3?'soon':'ok'};
}

async function recUnpay(id,ym){
  const s=S.sales.find(x=>x.id===id);if(!s||!s.recurring)return;const p=(s.recurring.payments||{})[ym];if(!p)return;
  const ok=await confirmDialog({title:`Desmarcar ${ymLabel(ym)}?`,body:'O pagamento desse mês volta para “a receber” e a entrada dele sai das suas vendas.',ok:'Desmarcar'});if(!ok)return;
  const pays={...s.recurring.payments};delete pays[ym];
  const ps=[Store.put('sales',{...s,recurring:{...s.recurring,payments:pays}})];if(p.saleId&&S.sales.find(x=>x.id===p.saleId))ps.push(Store.del('sales',p.saleId));
  await Promise.all(ps);render();toast('Pagamento desmarcado.');
}
function recHistory(id){
  const s=S.sales.find(x=>x.id===id);const x=recInfo(s);if(!x)return;
  const cur=today().slice(0,7);const months=[];for(let ym=x.r.start,i=0;i<120&&ym<=ymAdd(cur,1);ym=ymAdd(ym,1),i++)months.push(ym);
  const ov=openModal(`<div class="modal-head"><h2>${esc(s.clientName)}</h2><button class="icon-btn" data-close aria-label="Fechar">${icon('x')}</button></div>
  <div class="modal-body"><p class="muted sm" style="margin-bottom:12px">${fmt(+x.r.amount)} por mês · todo dia ${+x.r.day} · desde ${ymLabel(x.r.start)}</p>
  <div class="list">${months.reverse().map(ym=>{const p=(x.r.payments||{})[ym];const due=recDueDate(x.r,ym);const late=!p&&due<today();
    return `<div class="ed-ver"><div>${icon(p?'check':'clock',16)}<div><b>${esc(ymLabel(ym).replace(/^./,c=>c.toUpperCase()))}</b><small class="muted">${p?`Pago em ${fmtShortDate(iso(new Date(p.paidAt)))}`:late?`Venceu em ${fmtShortDate(due)}`:`Vence em ${fmtShortDate(due)}`}</small></div></div>
    ${p?`<button class="btn btn-ghost btn-sm" data-un="${ym}">Desmarcar</button>`:`<button class="btn ${late?'btn-primary':'btn-ghost'} btn-sm" data-pay="${ym}">Recebi</button>`}</div>`}).join('')}</div></div>`,{size:'sm'});
  $$('[data-pay]',ov).forEach(b=>b.onclick=async()=>{closeModal(ov,true);await recPay(id,b.dataset.pay)});
  $$('[data-un]',ov).forEach(b=>b.onclick=async()=>{closeModal(ov,true);await recUnpay(id,b.dataset.un)});
}

function promptText(){
  const t=SC.target;const n=nicheById(t.niche);const st=SITE_STYLES[SC.pStyle]||SITE_STYLES.escuro;
  const type={site:'um site institucional completo (one-page)',landing:'uma landing page de alta conversão',bio:'uma página de links para a bio do Instagram (estilo link na bio)',cardapio:'um cardápio digital acessado por QR code'}[SC.pType];
  const tech={lovable:'Use React + Tailwind (padrão do Lovable). Componentize as seções.',v0:'Use Next.js + Tailwind + shadcn/ui.',bolt:'Use Vite + React + Tailwind.',chatgpt:'Entregue um único arquivo index.html com CSS e JavaScript embutidos, pronto para publicar.',gemini:'Entregue um único arquivo index.html com CSS e JavaScript embutidos, pronto para publicar.'}[SC.pTarget];
  const wa=waNumber(t.whatsapp||t.phone);
  return `Crie ${type} para a empresa abaixo. ${tech}

## Empresa
- Nome: ${t.name||'[NOME DA EMPRESA]'}
- Segmento: ${n.label}
- Cidade: ${t.city||'[CIDADE]'}${t.address?`\n- Endereço: ${t.address}`:''}
- WhatsApp: ${t.whatsapp||t.phone||'[WHATSAPP]'}${wa?` (link: https://wa.me/${wa})`:''}${t.instagram?`\n- Instagram: @${String(t.instagram).replace('@','')}`:''}${t.rating?`\n- Avaliação no Google: ${String(t.rating).replace('.',',')}${t.reviews?` (${t.reviews} avaliações)`:''}`:''}
- Público: ${n.who} da região

## Objetivo
Gerar ${n.gain}. Todo botão de ação deve abrir o WhatsApp com uma mensagem pronta.

## Seções
${SC.pType==='bio'?`1. Topo com logo/nome, frase curta e selo de localização
2. Botões grandes: WhatsApp, Instagram, Localização (Google Maps), Serviços, Avaliações
3. Destaque com o serviço principal
4. Rodapé simples`:SC.pType==='cardapio'?`1. Cabeçalho com logo, horário e botão de pedido no WhatsApp
2. Categorias fixas no topo (rolagem horizontal)
3. Itens com nome, descrição curta, preço e foto (use espaços para fotos reais)
4. Carrinho simples que monta a mensagem do pedido para o WhatsApp
5. Rodapé com endereço e formas de pagamento`:`1. Cabeçalho fixo com logo e botão “Agendar pelo WhatsApp”
2. Hero com título forte, subtítulo com a cidade e dois botões (WhatsApp e Ver serviços)
3. Serviços em cards: ${n.services.join(', ')}
4. Diferenciais e sobre a empresa
5. Avaliações: mostre a nota do Google${t.rating?` (${String(t.rating).replace('.',',')})`:''} e um botão para ver as avaliações. NÃO invente depoimentos.
6. Perguntas frequentes (acordeão): ${n.faq.map(f=>f[0]).join(' / ')}
7. Localização com mapa do Google incorporado, endereço e horário
8. Chamada final + rodapé com Instagram e WhatsApp
9. Botão flutuante de WhatsApp`}

## Design
- Estilo: ${st.label.toLowerCase()}, moderno e profissional
- Cores: ${n.colors[0]} (principal), ${n.colors[1]} (destaque), fundo ${st.dark?'escuro':n.colors[2]}
- Tipografia: ${st.display} para títulos e ${st.body} para textos (Google Fonts)
- Bordas arredondadas, sombras suaves, bastante espaço em branco, animações sutis ao rolar
- Mobile first: perfeito no celular, sem rolagem lateral, botões fáceis de tocar

## Regras
- Textos em português do Brasil, persuasivos e naturais, sem lorem ipsum
- Não invente números, prêmios ou depoimentos; use marcadores como [FOTO DA FACHADA] onde faltar informação
- SEO: title, meta description, Open Graph e dados estruturados LocalBusiness (JSON-LD)
- Acessibilidade: contraste bom, textos alternativos nas imagens, foco visível
- Carregamento rápido: sem bibliotecas pesadas desnecessárias`;
}

  if(['pref-toast','pref-sound','pref-deadlines','pref-vibrate','pref-device','pref-pixflow'].includes(t.id)){const k={'pref-toast':'toast','pref-sound':'sound','pref-deadlines':'deadlines','pref-vibrate':'vibrate','pref-device':'device','pref-pixflow':'pixFlow'}[t.id];Store.setAccount({...S.account,prefs:{...prefs(),[k]:t.checked}});if(k==='sound'&&t.checked)chime();if(k==='vibrate'&&t.checked){try{navigator.vibrate&&navigator.vibrate(80)}catch{}}render();toast('Preferência salva.')}
  if((t.id==='pf-files'||t.id==='pf-folder')&&t.files&&t.files.length){const list=[...t.files];t.value='';handleUploads(t.dataset.id,list);return}
  if(t.id==='pref-push'&&!t.checked){Push.disable();return}
  if(t.id==='import-file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';importData(f);return}
  if(t.id==='pref-demo'){Store.setAccount({...S.account,demoDismissed:!t.checked});DEMO=null;S.kpiShown={};render()}
  if(t.id==='avatar-file'&&t.files&&t.files[0]){
    const file=t.files[0];if(!file.type.startsWith('image/'))return toast('Escolha um arquivo de imagem.','err');
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const s=160,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);
      Store.setAccount({...S.account,avatar:c.toDataURL('image/jpeg',.85)});render();toast('Foto atualizada.')};
    img.onerror=()=>{toast('Não foi possível ler esta imagem.','err')};img.src=url;
  }
});
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(!z)return;e.preventDefault();z.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(!z)return;e.preventDefault();z.classList.remove('over');if(t==='drop'&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)handleUploads(z.dataset.id,[...e.dataTransfer.files])}));
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyLook();render()})}
new MutationObserver(()=>{if(S.ready&&S.session&&!document.documentElement.hasAttribute('data-vtheme')){applyLook();render()}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});


/* ---------- Trava de arraste lateral ---------- */
const lockX=()=>{if(window.scrollX)window.scrollTo(0,window.scrollY);$$('.modal-body,.np-body,.content,.main,.app').forEach(el=>{if(el.scrollLeft)el.scrollLeft=0})};
addEventListener('scroll',lockX,{passive:true});
let _scr=false;addEventListener('scroll',()=>{const v=scrollY>8;if(v!==_scr){_scr=v;document.body.classList.toggle('scrolled',v)}},{passive:true});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.nodeType===1&&t.scrollLeft&&!t.closest('.seg,.table-wrap,.px-niches,.hscroll,.dh-filter,.gl-chips,.chips,.leaflet-container'))t.scrollLeft=0},{capture:true,passive:true});
let tStart=null;
document.addEventListener('touchstart',e=>{if(e.touches.length===1)tStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tStart||e.touches.length!==1)return;
  const dx=Math.abs(e.touches[0].clientX-tStart.x),dy=Math.abs(e.touches[0].clientY-tStart.y);
  if(dx>dy&&dx>6&&!e.target.closest('.seg,.table-wrap,.px-niches,.hscroll,.dh-filter,.gl-chips,.chips,.leaflet-container,input,textarea'))e.preventDefault();
},{passive:false});

/* ---------- Bloqueio de zoom ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<300&&!e.target.closest('input,textarea,select'))e.preventDefault();lastTouch=now},{passive:false});
addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','_','0'].includes(e.key))e.preventDefault()});


/* =========================================================
   Assinatura (Cakto): só entra quem tem assinatura ativa
   ========================================================= */
const PAYWALL_URL=String(CFG.checkoutUrl||'https://pay.cakto.com.br/g6hbcu5_1277769').trim();
const PLAN_PRICE=CFG.planPrice||'67,90';
let subTimer=0;
async function subCheck(user){
  clearInterval(subTimer);
  if(!PAYWALL_URL||isAdmin()){S.sub='active';return}
  const email=String((user&&user.email)||S.account?.email||'').toLowerCase();
  try{
    const {data,error}=await sb.from('assinaturas').select('status,current_until').eq('email',email).maybeSingle();
    if(error){S.sub='none';S.subErr=/assinaturas|PGRST205|42P01/i.test(error.message+error.code)?'table':'net';return}
    S.subErr='';const until=data?(data.current_until?new Date(data.current_until).getTime():Infinity):0; // sem data = acesso sem prazo
    S.sub=data&&['active','late','canceled'].includes(data.status)&&until>Date.now()?'active':'none';
    S.subInfo=data||null;
  }catch{S.sub='none';S.subErr='net'}
  if(S.sub!=='active')subTimer=setInterval(async()=>{if(!S.session){clearInterval(subTimer);return}const was=S.sub;await subCheck({email});if(S.sub==='active'&&was!=='active'){clearInterval(subTimer);routeFromHash();render();toast('Assinatura confirmada! Bem-vindo ao Vendly.')}},15000);
}
function paywallView(){
  const i=S.subInfo;const ended=i&&i.status;
  const feats=['Prospecção de empresas sem site no mapa, com WhatsApp','Agente de sites e páginas de links com IA','Cardápios digitais com QR Code para as mesas','Scripts de abordagem e prompts prontos','Orçamentos, vendas, clientes e projetos','Financeiro e faturamento por contrato'];
  return `<div class="paywall"><div class="pwl-card">
    <div class="pwl-brand">${mark()}<span>Vendly</span></div>
    <h1>${ended?'Sua assinatura não está ativa':'Falta só ativar sua assinatura'}</h1>
    <p class="pwl-sub">${ended?'Renove para voltar a usar todas as ferramentas.':'Assine para liberar todas as ferramentas do Vendly.'} Use o <b>mesmo e-mail</b> da sua conta: <b>${esc(S.account?.email||'')}</b></p>
    <div class="pwl-price"><span>R$</span><b>${esc(PLAN_PRICE)}</b><em>/mês</em></div>
    <ul>${feats.map(f=>`<li>${icon('check',16)}${f}</li>`).join('')}</ul>
    <a class="btn btn-primary btn-block pwl-cta" href="${esc(PAYWALL_URL)}" target="_blank" rel="noopener">${icon('sparkle',16)}Assinar agora</a>
    <button class="btn btn-ghost btn-block" data-pw="check">${icon('refresh',16)}Já assinei, liberar acesso</button>
    ${S.subErr==='table'?`<p class="err">Falta criar a tabela de assinaturas no Supabase (schema-assinaturas.sql).</p>`:''}
    <p class="pwl-foot">Depois do pagamento, o acesso libera sozinho em até 1 minuto. <button class="linkbtn" data-pw="logout">Sair da conta</button></p>
  </div></div>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-pw]');if(!b)return;
  if(b.dataset.pw==='logout'){clearInterval(subTimer);logout();return}
  if(b.dataset.pw==='check'){b.disabled=true;b.innerHTML='<span class="spin"></span>Verificando…';await subCheck({email:S.account?.email});if(S.sub==='active'){routeFromHash();render();toast('Assinatura confirmada! Bem-vindo ao Vendly.')}else{render();toast('Ainda não encontrei o pagamento. Se acabou de pagar, espere 1 minuto e tente de novo.','err')}}});
/* =========================================================
   Início
   ========================================================= */
(async function boot(){
  const pubMenu=new URLSearchParams(location.search).get('c');
  if(pubMenu){showPublicMenu(pubMenu);return}
  applyTheme();render();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='open'&&e.data.url){location.hash=(e.data.url.split('#')[1]||'dashboard')}})}
  if(!CONFIG_OK){S.ready=true;S.session=false;render();return}
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){S.recovering=true;S.ready=true;S.session=false;S.authView='newpass';render();return}
    if(S.recovering)return;
    if(session&&session.user){if(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='USER_UPDATED'){if(event==='USER_UPDATED'&&S.account){S.account.email=session.user.email;Store.user=session.user;render()}else setTimeout(()=>enterSession(session.user),0)}}
    else if(event==='SIGNED_OUT'||event==='INITIAL_SESSION'){Store.reset();S.ready=true;S.session=false;S.authView=S.authView==='check-email'?'check-email':(LS.get('vendly:lastEmail')?'login':'register');render()}
  });
})();
})();
</script>
