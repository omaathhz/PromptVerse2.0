<style>

/* ===== TOKENS ===== */
:root{
  --ink:#0D0D0D;
  --navy:#081F5C;
  --blue:#2563EB;
  --blue-hi:#3B82F6;
  --graphite:#161616;
  --white:#F8FAFC;

  --txt:#F8FAFC;
  --txt-2:#A8B1C4;
  --txt-3:#6B7488;
  --line:rgba(148,163,201,.14);
  --line-2:rgba(59,130,246,.28);
  --glass:rgba(22,22,22,.62);
  --glass-2:rgba(13,13,13,.72);
  --glow:0 0 0 1px rgba(59,130,246,.22), 0 18px 50px -22px rgba(37,99,235,.65);
  --r:16px; --r-lg:22px; --r-sm:10px;
  --sidebar:264px;
  --display:'Sora',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--txt); font-family:var(--body);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px;border-radius:6px}
::selection{background:var(--blue);color:#fff}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.12;letter-spacing:-.025em;margin:0}
h1{font-size:clamp(2.1rem,6.4vw,4.05rem);font-weight:800}
h2{font-size:clamp(1.65rem,4.4vw,2.7rem)}
h3{font-size:clamp(1.1rem,2.4vw,1.32rem)}
p{margin:0}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:#24304d;border-radius:20px;border:3px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:#33436c}

/* ===== ATOMS ===== */
.wrap{width:min(1200px,calc(100% - 40px));margin-inline:auto}
@media(max-width:640px){.wrap{width:calc(100% - 32px)}}
.eyebrow{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--blue-hi)}
.lead{color:var(--txt-2);font-size:clamp(1rem,2.1vw,1.12rem)}
.muted{color:var(--txt-2)}
.dim{color:var(--txt-3);font-size:.85rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:99px;
  font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:-.01em;transition:.22s ease;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--blue-hi),var(--blue) 55%,#1b4fd1);color:#fff;box-shadow:0 12px 34px -14px rgba(37,99,235,.9)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 44px -16px rgba(59,130,246,1)}
.btn-ghost{border:1px solid var(--line);color:var(--txt);background:rgba(248,250,252,.03)}
.btn-ghost:hover{border-color:var(--line-2);background:rgba(37,99,235,.12)}
.btn-sm{padding:9px 16px;font-size:.85rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px)}
.pad{padding:22px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.72rem;font-weight:600;
  font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.badge-blue{background:rgba(37,99,235,.16);color:#93b4fd;border:1px solid rgba(59,130,246,.3)}
.badge-soft{background:rgba(248,250,252,.06);color:var(--txt-2);border:1px solid var(--line)}
.badge-green{background:rgba(34,197,94,.13);color:#6ee7a8;border:1px solid rgba(34,197,94,.28)}

.logo-mark{width:34px;height:34px;flex:none;border-radius:22%;display:block;object-fit:cover}
.logo-lockup{display:flex;align-items:center;gap:10px}
.logo-word{font-family:var(--display);font-weight:800;font-size:1.06rem;letter-spacing:-.03em}
.logo-word span{color:var(--blue-hi);font-weight:600}

/* ===== ATMOSPHERE ===== */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura::before,.aura::after{content:"";position:absolute;border-radius:50%;filter:blur(120px);opacity:.5}
.aura::before{width:60vw;height:60vw;background:radial-gradient(circle,rgba(37,99,235,.34),transparent 62%);top:-22vw;right:-16vw}
.aura::after{width:52vw;height:52vw;background:radial-gradient(circle,rgba(8,31,92,.9),transparent 64%);bottom:-20vw;left:-14vw}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(148,163,201,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,201,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000,transparent 75%);
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000,transparent 75%)}

/* ===== SCREENS ===== */
.screen{display:none;position:relative;z-index:1}
.screen.on{display:block}

/* ===== SITE NAV ===== */
.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);background:rgba(13,13,13,.72);border-bottom:1px solid transparent;transition:.3s}
.nav.stuck{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:18px}
.nav-links{display:flex;gap:26px;font-size:.9rem;color:var(--txt-2)}
.nav-links a{transition:.2s}
.nav-links a:hover{color:var(--white)}
.nav-cta{display:flex;gap:10px;align-items:center}
@media(max-width:860px){.nav-links{display:none}.nav-cta .btn-ghost{display:none}}

/* ===== HERO ===== */
.hero{padding:clamp(52px,9vw,104px) 0 clamp(40px,6vw,72px)}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(28px,5vw,60px);align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr}}
.hero h1{margin:18px 0 20px}
.hero h1 em{font-style:normal;background:linear-gradient(105deg,#fff,var(--blue-hi) 45%,#1e4bd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 0}
.hero-proof{display:flex;gap:26px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.hero-proof div strong{display:block;font-family:var(--display);font-size:1.5rem;letter-spacing:-.03em}
.hero-proof div span{font-size:.78rem;color:var(--txt-3)}

/* app mock */
.mock{border-radius:var(--r-lg);border:1px solid var(--line-2);background:linear-gradient(160deg,rgba(8,31,92,.55),rgba(13,13,13,.9));
  box-shadow:var(--glow);overflow:hidden}
.mock-bar{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(13,13,13,.6)}
.dot{width:9px;height:9px;border-radius:50%;background:#2a3350}
.mock-body{display:grid;grid-template-columns:64px 1fr;min-height:330px}
.mock-side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.mock-ic{width:34px;height:34px;border-radius:10px;background:rgba(148,163,201,.08)}
.mock-ic.act{background:linear-gradient(135deg,var(--blue-hi),var(--blue));box-shadow:0 8px 20px -8px var(--blue)}
.mock-main{padding:18px}
.mock-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mock-kpi{background:rgba(248,250,252,.04);border:1px solid var(--line);border-radius:12px;padding:11px}
.mock-kpi b{font-family:var(--display);font-size:1.02rem;display:block}
.mock-kpi span{font-size:.62rem;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em}
.spark{width:100%;height:118px}
.mock-rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mock-row{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--txt-2);background:rgba(248,250,252,.03);border-radius:10px;padding:9px 11px}
.pulse{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ===== SECTIONS ===== */
.section{padding:clamp(56px,8vw,104px) 0}
.section-head{max-width:660px;margin-bottom:clamp(28px,4vw,48px)}
.section-head h2{margin:12px 0 14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr}}

.feat{position:relative;overflow:hidden;transition:.25s}
.feat:hover{transform:translateY(-3px);border-color:var(--line-2)}
.feat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;
  background:rgba(37,99,235,.14);border:1px solid rgba(59,130,246,.24);color:var(--blue-hi)}
.feat h3{font-size:1.02rem;margin-bottom:7px}
.feat p{font-size:.9rem;color:var(--txt-2)}
.feat .idx{position:absolute;top:16px;right:18px;font-family:var(--mono);font-size:.7rem;color:var(--txt-3)}

/* demo tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 16px;border-radius:99px;font-size:.86rem;border:1px solid var(--line);color:var(--txt-2);transition:.2s}
.tab.on{background:rgba(37,99,235,.16);border-color:var(--line-2);color:#fff}
.demo-stage{border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(160deg,rgba(8,31,92,.4),rgba(13,13,13,.85));padding:clamp(16px,3vw,28px);min-height:290px}

/* testimonials */
.quote{font-size:.95rem;color:var(--txt-2);margin-bottom:16px}
.who{display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:.85rem;flex:none}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.who b{font-size:.88rem;display:block}
.who span{font-size:.75rem;color:var(--txt-3)}

/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
@media(max-width:900px){.plans{grid-template-columns:1fr;max-width:440px;margin-inline:auto}}
.plan{padding:26px;position:relative}
.plan.best{border-color:rgba(59,130,246,.5);background:linear-gradient(170deg,rgba(37,99,235,.16),rgba(13,13,13,.85));box-shadow:var(--glow);transform:scale(1.02)}
@media(max-width:900px){.plan.best{transform:none}}
.plan .price{font-family:var(--display);font-size:2.5rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin:14px 0 4px}
.plan .price small{font-size:.9rem;font-weight:500;color:var(--txt-3);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:20px 0 24px;display:flex;flex-direction:column;gap:10px}
.plan li{display:flex;gap:9px;font-size:.88rem;color:var(--txt-2);align-items:flex-start}
.plan li svg{flex:none;margin-top:3px;color:var(--blue-hi)}
.plan li.off{color:var(--txt-3)}
.plan li.off svg{color:#3b4257}
.ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%)}

.cmp{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:30px;min-width:520px}
.cmp th,.cmp td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line)}
.cmp th{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);font-weight:600}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:130px}
.cmp td:first-child{color:var(--txt-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* faq */
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:19px 0;text-align:left;
  font-family:var(--display);font-weight:600;font-size:1rem}
.faq-q svg{flex:none;transition:.25s;color:var(--blue-hi)}
.faq-item.open .faq-q svg{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;color:var(--txt-2);font-size:.92rem}
.faq-item.open .faq-a{max-height:280px}
.faq-a p{padding-bottom:19px}

/* final cta */
.final{border-radius:var(--r-lg);border:1px solid var(--line-2);padding:clamp(32px,6vw,64px);text-align:center;
  background:radial-gradient(120% 140% at 50% 0%,rgba(37,99,235,.28),rgba(13,13,13,.9) 68%)}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--txt-3);font-size:.84rem}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}

/* ===== AUTH ===== */
.auth{min-height:100vh;display:grid;place-items:center;padding:28px 0;position:relative;z-index:1;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(37,99,235,.16),transparent 70%)}
.auth::before,.auth::after{content:"";position:fixed;border-radius:50%;filter:blur(85px);z-index:-1;pointer-events:none}
.auth::before{width:75vw;height:75vw;max-width:680px;max-height:680px;background:radial-gradient(circle,rgba(37,99,235,.62),transparent 68%);top:-14vw;right:-18vw}
.auth::after{width:65vw;height:65vw;max-width:600px;max-height:600px;background:radial-gradient(circle,rgba(8,31,92,1),transparent 68%);bottom:-14vw;left:-16vw}
.auth-card{width:min(430px,100%);padding:30px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;color:var(--txt-2);margin-bottom:6px;font-weight:500}
.input,select.input,textarea.input{width:100%;background:rgba(248,250,252,.04);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 13px;font-size:16px;transition:.2s}
.input:focus{outline:none;border-color:var(--blue);background:rgba(37,99,235,.08)}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%236B7488' stroke-width='2'><path d='M2 5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.auth-alt{text-align:center;font-size:.84rem;color:var(--txt-3);margin-top:16px}
.auth-alt button{color:var(--blue-hi);font-weight:600}

/* ===== APP SHELL ===== */
.app{min-height:100vh;position:relative;z-index:1}
.side{border-right:1px solid var(--line);background:var(--glass-2);backdrop-filter:blur(18px);
  position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;max-height:100vh;overflow:hidden;z-index:20;
  display:flex;flex-direction:column;padding:20px 14px}
.side-nav{display:flex;flex-direction:column;gap:3px;margin-top:22px;overflow-y:auto;flex:1}
.side-lbl{font-family:var(--mono);font-size:.63rem;text-transform:uppercase;letter-spacing:.16em;color:var(--txt-3);padding:16px 12px 6px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:.89rem;color:var(--txt-2);transition:.18s;text-align:left;width:100%}
.nv svg{flex:none;opacity:.75}
.nv:hover{background:rgba(248,250,252,.05);color:#fff}
.nv.on{background:linear-gradient(100deg,rgba(37,99,235,.22),rgba(37,99,235,.05));color:#fff;box-shadow:inset 0 0 0 1px rgba(59,130,246,.24)}
.nv.on svg{opacity:1;color:var(--blue-hi)}
.side-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.plan-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:12px;
  background:rgba(37,99,235,.12);border:1px solid rgba(59,130,246,.24);font-size:.78rem}

.main{min-width:0;margin-left:var(--sidebar);display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 22px;
  border-bottom:1px solid var(--line);background:rgba(13,13,13,.82);backdrop-filter:blur(16px)}
.top h2{font-size:1.08rem}
.top .sub{font-size:.76rem;color:var(--txt-3);font-family:var(--body);font-weight:400;letter-spacing:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-2);transition:.2s;position:relative}
.icon-btn:hover{border-color:var(--line-2);color:#fff}
.dot-alert{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#3B82F6;box-shadow:0 0 0 2px var(--ink)}
.view{padding:22px;flex:1}
.burger{display:none}
@media(max-width:1000px){
  .main{margin-left:0}
  .side{width:284px;z-index:60;transform:translateX(-102%);transition:.3s cubic-bezier(.4,0,.2,1)}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .burger{display:grid}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none}
  .scrim.on{display:block}
  .view{padding:16px}
  .top{padding:12px 16px}
}

/* notifications */
.pop{position:absolute;top:52px;right:0;width:min(330px,90vw);z-index:50;padding:8px;display:none}
.pop.on{display:block}
.nt{display:flex;gap:11px;padding:11px;border-radius:11px;transition:.2s}
.nt:hover{background:rgba(248,250,252,.04)}
.nt .nt-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(37,99,235,.15);color:var(--blue-hi)}
.nt b{font-size:.84rem;display:block}
.nt span{font-size:.75rem;color:var(--txt-3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr;gap:10px}}
.kpi{padding:16px}
.kpi .lbl{font-size:.72rem;color:var(--txt-3);text-transform:uppercase;letter-spacing:.11em;font-family:var(--mono)}
.kpi .val{font-family:var(--display);font-size:clamp(1.35rem,3.4vw,1.75rem);font-weight:700;letter-spacing:-.03em;margin:7px 0 3px}
.trend{font-size:.78rem;display:inline-flex;align-items:center;gap:5px;color:#6ee7a8}
.trend.down{color:#f8a3a3}

.panel{margin-top:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h3{font-size:.98rem}
.panel-body{padding:18px}
.seg{display:flex;gap:4px;background:rgba(248,250,252,.04);padding:4px;border-radius:99px;border:1px solid var(--line)}
.seg button{padding:6px 13px;border-radius:99px;font-size:.78rem;color:var(--txt-2);transition:.18s}
.seg button.on{background:rgba(37,99,235,.35);color:#fff}

table.data{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
table.data th{text-align:left;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--txt-3);padding:0 14px 10px;font-weight:500}
table.data td{padding:12px 14px;border-top:1px solid var(--line);color:var(--txt-2)}
table.data td b{color:var(--txt);font-weight:600}

/* generic list/card grids inside app */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;font-size:.8rem;border:1px solid var(--line);color:var(--txt-2);transition:.18s;white-space:nowrap}
.chip:hover{border-color:var(--line-2);color:#fff}
.chip.on{background:rgba(37,99,235,.2);border-color:var(--line-2);color:#fff}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--txt-3)}
.empty h4{font-family:var(--display);color:var(--txt);margin-bottom:6px;font-size:1rem}
/* Galeria de Prompts */
.gal-wrap{display:flex;flex-direction:column;gap:14px}
.chip-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;
  font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--accent-2,#3B82F6);border:1px solid rgba(37,99,235,.4);background:rgba(37,99,235,.1)}
.gal-search{display:flex;gap:10px;align-items:center}
.gal-search .input{flex:1}
.gal-count{white-space:nowrap;display:flex;align-items:center;gap:6px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r);
  font-size:.78rem;color:var(--txt-2)}
.gal-cats{display:flex;gap:8px;flex-wrap:wrap}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:6px}
.gal-card{background:var(--card,#161616);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gal-stage{position:relative;width:100%;aspect-ratio:9/16;max-height:56vh;overflow:hidden;background:#0d0d0d}
.gal-stage video,.gal-stage img{width:100%;height:100%;object-fit:cover}
.gal-stage .vid-play,.gal-stage.needtap .vid-play{display:none!important}
.ugc-stage .ugc-tap,.ugc-stage.needtap .ugc-tap{display:none!important}
.gal-stage video{cursor:pointer}
.gal-tag{position:absolute;top:10px;left:10px;z-index:2;padding:5px 12px;border-radius:99px;font-size:.68rem;font-weight:700;
  letter-spacing:.03em;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;border:1px solid rgba(255,255,255,.15)}
.gal-body{padding:14px}
.gal-body h4{font-family:var(--display);font-size:.95rem;margin-bottom:10px;color:var(--txt)}
@media(max-width:640px){.gal-grid{grid-template-columns:1fr}}
/* Dashboard */
.dash-wrap{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.dash-card{background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;
  backdrop-filter:blur(14px);transition:.2s}
.dash-card:hover{border-color:var(--line-2)}
.dash-hero{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line-2);
  box-shadow:var(--glow);aspect-ratio:16/9;touch-action:pan-y}
.dash-hero-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.dash-hero-track.notransition{transition:none}
.dash-hero-track img{width:100%;height:100%;object-fit:cover;flex:0 0 100%;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.dash-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2}
.dash-dots span{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.4)}
.dash-dots span.on{background:var(--blue-hi);width:16px;border-radius:99px}
.dash-hello{font-family:var(--display);font-size:1.3rem;color:var(--txt);margin-top:4px}
.dash-actions{display:flex;gap:10px}
.dash-actions .btn{flex:1}
.dash-meta{border-color:var(--line-2);box-shadow:var(--glow)}
.dm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.86rem;color:var(--txt-2)}
.dm-head b{color:var(--txt);font-family:var(--display);font-weight:600}
.dash-bar{height:8px;border-radius:99px;background:rgba(148,163,201,.14);overflow:hidden}
.dash-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-hi));transition:width .4s}
.dash-pct{display:block;text-align:right;margin-top:6px;font-size:.76rem;color:var(--blue-hi);font-weight:600}
.dash-stat label{display:block;color:var(--txt-3);font-size:.8rem;margin-bottom:6px}
.dash-stat b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--txt)}
.dash-chart-head{margin-bottom:12px}
.dash-filters{display:flex;gap:6px;flex-wrap:wrap}
.dash-filters button{display:flex;align-items:center;gap:4px;padding:6px 13px;border-radius:99px;font-size:.76rem;
  border:1px solid var(--line);color:var(--txt-2);background:transparent}
.dash-filters button.on{background:rgba(37,99,235,.18);border-color:var(--line-2);color:var(--txt)}
.dash-datepick{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:.76rem;
  border:1px solid var(--line);color:var(--txt-2);cursor:pointer}
.dash-datepick.on{background:rgba(37,99,235,.18);border-color:var(--line-2);color:var(--txt)}
.dash-datepick input{background:transparent;border:0;color:inherit;font:inherit;padding:0;width:92px}
.dash-datepick input::-webkit-calendar-picker-indicator{filter:invert(.7)}

/* studio */
.studio{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.studio{grid-template-columns:1fr}}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-face{aspect-ratio:3/4;border-radius:var(--r);border:1px solid var(--line-2);position:relative;overflow:hidden;
  background:radial-gradient(80% 70% at 50% 25%,rgba(37,99,235,.28),rgba(8,31,92,.55) 55%,rgba(13,13,13,.95))}
.preview-face .silhouette{position:absolute;inset:0;display:grid;place-items:center;color:rgba(148,163,201,.35)}
.prompt-out{font-family:var(--mono);font-size:.8rem;line-height:1.75;color:#c3d3f5;background:rgba(8,31,92,.35);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;white-space:pre-wrap;word-break:break-word}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:440px}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(74ch,86%);padding:12px 15px;border-radius:16px;font-size:.92rem;line-height:1.65;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#1b4fd1);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:rgba(248,250,252,.05);border:1px solid var(--line);border-bottom-left-radius:5px}
.chat-in{border-top:1px solid var(--line);padding:12px;display:flex;gap:10px;align-items:flex-end}
.chat-in textarea{flex:1;resize:none;max-height:130px;min-height:44px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue-hi);margin-right:4px;animation:bob 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:.78rem;color:var(--txt-2);transition:.18s}
.cal .cell.has{background:rgba(37,99,235,.22);border-color:var(--line-2);color:#fff;font-weight:600}
.cal .cell.head{border:none;color:var(--txt-3);font-family:var(--mono);font-size:.66rem;text-transform:uppercase}

/* course */
.bar{height:7px;border-radius:99px;background:rgba(248,250,252,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-hi))}

/* ranking */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.pod{padding:18px 14px;text-align:center;border-radius:var(--r)}
.pod .med{font-size:1.6rem}
.pod.p1{background:linear-gradient(180deg,rgba(37,99,235,.25),rgba(13,13,13,.6));border:1px solid rgba(59,130,246,.4);padding-block:26px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.medal{padding:16px 12px;text-align:center;border-radius:var(--r);border:1px solid var(--line);background:rgba(248,250,252,.03)}
.medal.locked{opacity:.4}
.medal .em{font-size:1.5rem}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,15,.78);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.modal-card{width:min(620px,100%);max-height:88vh;overflow-y:auto;background:linear-gradient(170deg,rgba(8,31,92,.6),rgba(13,13,13,.97));
  border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:0 40px 90px -30px #000}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,13,13,.9);backdrop-filter:blur(10px)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120%);z-index:99;padding:12px 20px;border-radius:99px;
  background:rgba(37,99,235,.95);color:#fff;font-size:.87rem;font-weight:600;transition:.35s cubic-bezier(.2,.9,.3,1);box-shadow:0 18px 40px -16px #000}
.toast.on{transform:translate(-50%,0)}

.reveal{opacity:0;transform:translateY(22px);transition:.7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}

.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
/* grade unica: cards de imagem e de video lado a lado, na mesma linha */
.mix-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-items:start}
.mix-grid .lib-card,.mix-grid .vid-card{height:100%}
.mix-grid .lib-img,.mix-grid .vid-stage{aspect-ratio:9/16;max-height:none}
.mix-grid .lib-img img{object-fit:cover}
.vid-card{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);transition:.22s}
.vid-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 14px 32px rgba(8,31,92,.34)}
.vid-stage{position:relative;width:100%;aspect-ratio:9/16;max-height:56vh;overflow:hidden;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(8,31,92,.55),rgba(13,13,13,.96))}
.vid-stage video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vid-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--txt-3)}
.vid-play{position:absolute;inset:0;display:none;place-items:center;border:0;width:100%;cursor:pointer;
  background:rgba(13,13,13,.32);color:#fff;transition:background .2s ease}
.vid-stage.needtap .vid-play{display:grid}
.vid-play span.pb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:rgba(37,99,235,.92);box-shadow:0 0 0 8px rgba(59,130,246,.16),0 10px 24px rgba(8,31,92,.5)}
.vid-body{display:flex;flex-direction:column;gap:8px;padding:13px 14px 14px}
.vid-body h4{font-family:var(--display);font-size:.9rem;line-height:1.32;color:var(--white);margin:0}
.vid-oque{margin:0;font-size:.75rem;line-height:1.55;color:var(--txt-2)}
.vid-oque b{display:block;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);margin-bottom:3px}
.vid-body .btn{padding:10px 12px;font-size:.78rem;border-radius:11px}
.vid-steps{overflow:hidden;max-height:0;opacity:0;transition:max-height .32s ease,opacity .25s ease,margin .32s ease}
.vid-steps.open{max-height:420px;opacity:1;margin-top:4px}
.vid-steps .inner{display:flex;flex-direction:column;gap:8px;padding-top:11px;border-top:1px dashed var(--line)}
@media(max-width:640px){
  .lib-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .vid-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:420px){
  .lib-grid{grid-template-columns:1fr}
  .vid-grid{grid-template-columns:1fr}
}

/* ganchos virais */
.gan-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.gan-tab{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(22,22,22,.6);
  color:var(--txt-2);font:inherit;font-size:.8rem;cursor:pointer;transition:.2s}
.gan-tab:hover{border-color:var(--line-2);color:var(--white)}
.gan-tab.on{background:rgba(37,99,235,.16);border-color:var(--line-2);color:var(--white);
  box-shadow:0 0 14px rgba(59,130,246,.24)}
.gan-tab b{font-weight:600}
.gan-tab span{opacity:.55;margin-left:6px;font-size:.74rem}
.gan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.gan-card{display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:15px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.gan-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 14px 30px rgba(8,31,92,.32)}
.gan-top{display:flex;align-items:center;gap:8px}
.gan-fmt{font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-hi);
  background:rgba(37,99,235,.14);border:1px solid var(--line-2);border-radius:99px;padding:3px 9px}
.gan-nicho{font-size:.68rem;color:var(--txt-3);margin-left:auto}
.gan-txt{margin:0;font-size:.92rem;line-height:1.5;color:var(--white);font-family:var(--display)}
.gan-obs{margin:0;font-size:.74rem;line-height:1.55;color:var(--txt-2)}
.gan-card .btn{margin-top:auto;padding:9px 12px;font-size:.76rem;border-radius:10px}
@media(max-width:640px){
  .gan-grid{grid-template-columns:1fr}
  .gan-card .btn{padding:12px}
}

/* gerar videos de graca */
.free-wrap{max-width:560px;margin:0 auto}
.free-card{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(14px);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.free-card:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 18px 40px rgba(8,31,92,.38)}
.free-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);
  background:linear-gradient(160deg,rgba(8,31,92,.6),rgba(13,13,13,.96))}
.free-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.free-card:hover .free-thumb img{transform:scale(1.04)}
.free-body{display:flex;flex-direction:column;gap:12px;padding:18px}
.free-body h4{font-family:var(--display);font-size:1.06rem;line-height:1.35;color:var(--white);margin:0}
.free-body .btn{padding:13px 16px;font-size:.86rem;border-radius:12px}
.tool-list{display:flex;flex-direction:column;gap:10px}
.tool-link{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:13px;text-decoration:none;
  border:1px solid var(--line);background:rgba(22,22,22,.6);color:var(--white);
  transition:transform .18s ease,border-color .18s ease,background .18s ease}
.tool-link:hover{transform:translateX(3px);border-color:var(--line-2);background:rgba(37,99,235,.12)}
.tool-link .tl-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--blue-hi);background:rgba(37,99,235,.16);border:1px solid var(--line-2);
  box-shadow:0 0 12px rgba(59,130,246,.26)}
.tool-link b{font-family:var(--display);font-size:.9rem;letter-spacing:.02em;display:block}
.tool-link small{font-size:.72rem;color:var(--txt-3)}
.tool-link .tl-go{margin-left:auto;color:var(--txt-3)}
@media(max-width:640px){
  .free-body{padding:15px}
  .free-body .btn{padding:14px;font-size:.88rem}
  .tool-link{padding:15px}
}

.vid-stage.needtap .vid-play{display:grid}

.vid-body{display:flex;flex-direction:column;gap:8px;padding:13px 14px 14px}
.vid-body h4{font-family:var(--display);font-size:.9rem;line-height:1.32;color:var(--white);margin:0}
.vid-oque{margin:0;font-size:.75rem;line-height:1.55;color:var(--txt-2)}

@media(max-width:640px){

}
@media(max-width:420px){
  .vid-grid{grid-template-columns:1fr}

}

/* metodo - aulas em video */
.aula-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.aula-card{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.aula-card:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 16px 36px rgba(8,31,92,.34)}
.aula-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);
  background:linear-gradient(160deg,rgba(8,31,92,.62),rgba(13,13,13,.96))}
.aula-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.aula-card:hover .aula-thumb img{transform:scale(1.05)}
.aula-thumb .aula-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--txt-3)}
.aula-thumb .aula-ph small{font-size:.7rem;letter-spacing:.05em}
.aula-thumb .aula-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

.aula-body{display:flex;flex-direction:column;gap:11px;padding:14px 15px 16px}
.aula-body h4{font-family:var(--display);font-size:.96rem;line-height:1.35;color:var(--white);margin:0}
@media(max-width:640px){

}

/* biblioteca - cards de prompt */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.lib-card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.lib-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 12px 28px rgba(8,31,92,.32)}
.lib-card:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.lib-img{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;
  background:linear-gradient(160deg,rgba(8,31,92,.5),rgba(13,13,13,.96));border-bottom:1px solid var(--line)}
.lib-img img{width:100%;height:100%;object-fit:contain;display:block}
.lib-img .lib-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--txt-3)}
.lib-img .lib-ph small{font-size:.66rem;letter-spacing:.05em}
.lib-body{display:flex;flex-direction:column;gap:9px;padding:14px 14px 15px}
.lib-body h4{font-family:var(--display);font-size:.94rem;line-height:1.32;color:var(--white);margin:0}
.lib-body p.lib-desc{margin:0;font-size:.8rem;line-height:1.6;color:var(--txt-2)}
.lib-body .btn{margin-top:3px;padding:10px 12px;font-size:.8rem;border-radius:11px}
.lib-steps{display:flex;flex-direction:column;gap:9px}
.lib-steps b.lib-steps-t{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
.lib-step{display:flex;gap:9px;align-items:flex-start;font-size:.82rem;line-height:1.55;color:var(--txt-2)}
.lib-step span.num{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:.66rem;font-weight:700;color:var(--blue-hi);background:rgba(37,99,235,.16);
  border:1px solid var(--line-2);box-shadow:0 0 9px rgba(59,130,246,.28)}
.lib-modal-img{border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:14px;
  background:#0D0D0D;display:grid;place-items:center}
.lib-modal-img img{max-width:100%;max-height:46vh;object-fit:contain;display:block}
@media(max-width:640px){
  .lib-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .lib-body{padding:11px}
  .lib-body h4{font-size:.84rem}
  .lib-body p.lib-desc{font-size:.74rem}
}
@media(max-width:420px){
  .lib-grid{grid-template-columns:1fr}
}

/* prompt modelo ugc */
.ugc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ugc-card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.ugc-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 14px 34px rgba(8,31,92,.34)}
.ugc-card .ugc-tag{font-family:var(--display);font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;color:var(--white)}
.ugc-card .ugc-tag i{width:7px;height:7px;border-radius:50%;background:var(--blue-hi);
  box-shadow:0 0 10px 2px rgba(59,130,246,.6)}
.ugc-stage{position:relative;aspect-ratio:9/16;width:100%;border-radius:13px;overflow:hidden;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,31,92,.55),rgba(13,13,13,.96))}
.ugc-stage video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.ugc-tap{position:absolute;inset:0;display:none;place-items:center;border:0;background:rgba(13,13,13,.45);
  color:#fff;cursor:pointer;width:100%}
.ugc-stage.needtap .ugc-tap{display:grid}
@media(max-width:760px){.ugc-stage{max-height:58vh}}
.ugc-empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--txt-3)}
.ugc-empty small{font-size:.74rem;letter-spacing:.04em}
.ugc-stage video{cursor:pointer}
.ugc-hint{font-size:.78rem;line-height:1.6;color:var(--txt-2);background:rgba(37,99,235,.08);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media(max-width:760px){
  .ugc-grid{grid-template-columns:1fr}
  .ugc-stage{max-height:none}
}

/* ===== CENTRALIZAÇÃO E CONTENÇÃO ===== */
.grid-2>*,.grid-3>*,.grid-4>*,.kpis>*,.cards>*,.studio>*,.plans>*,.stack>*,.podium>*{min-width:0}
.grid-2,.grid-3,.grid-4,.kpis,.cards,.studio,.stack{min-width:0}
.card,.panel,.panel-body,.main,.view{min-width:0;max-width:100%}
.scroll-x{max-width:100%;width:100%}
.copy-box,.prompt-out,.quote,.msg{overflow-wrap:anywhere}
html{overflow-x:hidden}

/* conteúdo centralizado e com largura de leitura confortável */
.view{width:100%;max-width:1180px;margin-inline:auto}
.top{padding-inline:max(22px,calc((100% - 1180px) / 2))}
@media(max-width:1000px){.top{padding-inline:16px}}

/* colunas duplas viram uma coluna antes de espremer */
@media(max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
}
@media(max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr}
  .podium{grid-template-columns:1fr}
  .modal-card{max-height:92vh}
}

/* ===== PROMPTS BÔNUS ===== */
.bonus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media(max-width:520px){.bonus-grid{grid-template-columns:1fr 1fr;gap:12px}}
.bonus-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--glass);text-align:left;transition:.22s;display:block;width:100%}
.bonus-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--glow)}
.bonus-thumb{aspect-ratio:4/5;background:#0b0b0b;position:relative}
.bonus-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bonus-card .info{padding:13px}
.bonus-card h4{font-family:var(--display);font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1.25;margin:0 0 6px}
.bonus-card p{font-size:.76rem;color:var(--txt-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bonus-hero{text-align:center;padding:26px 22px 24px}
.bonus-hero h2{font-size:clamp(1.5rem,5vw,2.1rem);text-transform:uppercase;margin:14px 0 12px;
  background:linear-gradient(105deg,#fff,var(--blue-hi) 55%,#1e4bd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.bonus-hero .big-img{border-radius:18px;overflow:hidden;border:1px solid var(--line-2);margin:18px 0;box-shadow:var(--glow)}
.bonus-hero .big-img img{width:100%;display:block}
.btn-copy-big{width:100%;padding:17px 20px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:.94rem;
  text-transform:uppercase;letter-spacing:.03em;color:#fff;
  background:linear-gradient(135deg,var(--blue-hi),var(--blue) 55%,#1b4fd1);box-shadow:0 16px 40px -16px rgba(59,130,246,.95);transition:.22s}
.btn-copy-big:hover{transform:translateY(-2px);box-shadow:0 22px 50px -18px rgba(59,130,246,1)}
.bonus-how{font-family:var(--display);font-weight:600;font-size:.84rem;color:var(--txt-2);margin-bottom:12px}

/* =====================================================================
   MODO CLARO — só troca cores. Escuro continua sendo o padrão.
   Ativado por <html data-theme="light"> (botão sol/lua no topo ou em Minha conta).
   ===================================================================== */
html[data-theme="light"]{
  --ink:#F3F5FA;--graphite:#FFFFFF;--white:#0F172A;
  --txt:#0F172A;--txt-2:#475569;--txt-3:#64748B;
  --line:rgba(15,23,42,.10);--line-2:rgba(37,99,235,.32);
  --glass:rgba(255,255,255,.9);--glass-2:rgba(255,255,255,.95);--card:#FFFFFF;
  --glow:0 0 0 1px rgba(37,99,235,.18),0 18px 40px -24px rgba(37,99,235,.35);
  color-scheme:light}
html[data-theme="light"] body{background:var(--ink);color:var(--txt)}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.18)}
html[data-theme="light"] .aura::before{opacity:.35}
html[data-theme="light"] .aura::after{background:radial-gradient(circle,rgba(37,99,235,.14),transparent 64%)}
html[data-theme="light"] .grid-bg{background-image:linear-gradient(rgba(15,23,42,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.05) 1px,transparent 1px)}
html[data-theme="light"] .av,html[data-theme="light"] .btn-primary,html[data-theme="light"] .btn-copy-big{color:#fff}
html[data-theme="light"] .seg button.on,html[data-theme="light"] .chip.on,html[data-theme="light"] .tab.on,html[data-theme="light"] .nv.on{color:#1D4ED8}
html[data-theme="light"] .mm-tab.on{color:#fff}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(15,23,42,.18)}
html[data-theme="light"] [style*="color:#6ee7a8"]{color:#15803d!important}
html[data-theme="light"] [style*="color:#f8a3a3"]{color:#b91c1c!important}
html[data-theme="light"] [style*="color:#3b4257"]{color:#94a3b8!important}
html[data-theme="light"] [style*="rgba(8,31,92,.32)"]{background:rgba(37,99,235,.07)!important}
html[data-theme="light"] input::placeholder,html[data-theme="light"] textarea::placeholder{color:#94a3b8}

function ico(n,sz=18){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`}
function paintIcons(root){(root||document).querySelectorAll('[data-ic]').forEach(el=>{
  const s=document.createElement('span');s.style.display='inline-flex';
  s.innerHTML=ico(el.dataset.ic,+(el.dataset.sz||18));el.replaceWith(s);});}
function escAttr(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escapeHTML(s){return escAttr(s);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
function copy(text,label){
 const nome=(label||'Texto');
 if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(text).then(()=>toast(nome+' copiado')).catch(()=>copyFallback(text,nome));
 }else copyFallback(text,nome);
}
function copyFallback(text,nome){
 let ok=false;
 try{
   const ta=document.createElement('textarea');
   ta.value=text; ta.setAttribute('readonly','');
   ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
   document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
   ok=document.execCommand('copy');
   document.body.removeChild(ta);
 }catch(e){ok=false;}
 if(ok)toast(nome+' copiado'); else copyManual(text,nome);
}
function copyManual(text,nome){
 openModal(`<div class="modal-head"><div><h3>${nome}</h3><p class="dim">O navegador bloqueou a cópia automática. Toque no texto, segure e copie.</p></div>
   <button class="icon-btn" onclick="closeModal()">${ico('x')}</button></div>
   <div class="pad"><textarea class="input" id="manualCopy" rows="10" readonly style="font-family:var(--mono);font-size:16px">${escapeHTML(text)}</textarea>
   <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="selectManual()">Selecionar tudo</button></div>`);
 setTimeout(selectManual,120);
}
function selectManual(){const t=$('#manualCopy');if(t){t.focus();t.select();t.setSelectionRange(0,t.value.length);}}

function openModal(html){$('#modalCard').innerHTML=html;$('#modal').classList.add('on');paintIcons($('#modalCard'));}
function closeModal(){$('#modal').classList.remove('on');}


/* ---- navegação entre os dois módulos ---- */
let VIEW_ATUAL='prompts';
function nav(v){ abrir(v==='ganchos'?'ganchos':'prompts'); }
function abrir(v){
  VIEW_ATUAL=v;
  const def=VIEWS[v];
  $('#pgTitulo').textContent=def.title;
  document.querySelectorAll('.pg-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  liberarVideos($('#view'));
  $('#view').innerHTML=def.html();
  paintIcons($('#view'));
  if(def.after)def.after();
  medirTopo();
  try{ location.hash=v; }catch(e){}
}
function medirTopo(){
  const t=document.querySelector('.pg-top'), sub=document.querySelector('.pg-sub');
  if(!t||!sub)return;
  sub.style.top=t.offsetHeight+'px';
  document.querySelector('.pg-body').style.paddingTop=(t.offsetHeight+sub.offsetHeight+16)+'px';
}
window.addEventListener('resize',medirTopo);
window.addEventListener('orientationchange',()=>setTimeout(medirTopo,300));

/* ---- modo claro / escuro ---- */
function temaSalvo(){ try{ return localStorage.getItem('pv2_tema')==='light'?'light':'dark'; }catch(e){ return 'dark'; } }
function aplicarTema(){
  const t=temaSalvo();
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  const m=document.querySelector('meta[name="theme-color"]'); if(m)m.content=t==='light'?'#F3F5FA':'#0D0D0D';
  const b=$('#btnTema'); if(b)b.innerHTML=ico(t==='light'?'moon':'sun',18);
}
function definirTema(t){ try{localStorage.setItem('pv2_tema',t);}catch(e){} aplicarTema(); }
function alternarTema(){ definirTema(temaSalvo()==='light'?'dark':'light'); }

VIEWS.ganchos={title:'Ganchos virais',sub:'As primeiras linhas que seguram o vídeo, prontas para adaptar ao seu produto',html(){
 const f=S.ganFmt||'Todos';
 const lista=f==='Todos'?GANCHOS:GANCHOS.filter(g=>g.fmt===f);
 const cont=x=>x==='Todos'?GANCHOS.length:GANCHOS.filter(g=>g.fmt===x).length;
 return `<div class="gan-tabs">${['Todos','POV','UGC'].map(x=>`
   <button class="gan-tab${f===x?' on':''}" onclick="S.ganFmt='${x}';nav('ganchos')"><b>${x}</b><span>${cont(x)}</span></button>`).join('')}</div>
 ${lista.length?`<div class="gan-grid">${lista.map((g,i)=>`
   <div class="gan-card">
     <div class="gan-top"><span class="gan-fmt">${g.fmt}</span>${g.nicho?`<span class="gan-nicho">${g.nicho}</span>`:''}</div>
     <p class="gan-txt">${g.txt}</p>
     ${g.obs?`<p class="gan-obs">${g.obs}</p>`:''}
     <button class="btn btn-primary btn-block" onclick="copyGancho(${GANCHOS.indexOf(g)})">${ico('copy',15)} COPIAR GANCHO</button>
   </div>`).join('')}</div>`
 :`<div class="empty"><h4>Nenhum gancho neste formato ainda</h4><p>Os ganchos de ${f} entram aqui assim que forem cadastrados.</p></div>`}`;
}};
function copyGancho(i){
 const t=GANCHOS[i].txt;
 if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(t).then(()=>toast('Gancho copiado com sucesso.')).catch(()=>copy(t,'Gancho'));
 }else copy(t,'Gancho');
}

  p:`Generate an ultra-realistic smartphone photo of a female fashion store owner taking a mirror selfie to showcase her outfit of the day, as if posting on Instagram. The result must look indistinguishable from a real photo (NOT AI-generated).

  p:`Animate the subject as a REAL person in a soft ultra-realistic diagonal back-view fashion video.
—

—

- Hair starts naturally loose

- Elbows lift softly and naturally
- The subject gently holds the gathered hair briefly behind the head
- She lightly twists or adjusts the hair as if preparing to tie it
- The motion is subtle and relaxed - the hair should NOT become perfectly tied
- It should feel like a casual "fixing the hair" moment
- After briefly holding the hair, she softly relaxes the hands slightly

- Hair movement must come ONLY from both-hand contact and natural head motion
- Hair must have realistic weight and gravity, no floating hair, no wind effect, no exaggerated bounce, no zero-gravity movement

- Hair should naturally loosen slightly after the motion
—
IMPORTANT ANTI-BUG RULES:
- Keep the subject ALWAYS in the same diagonal back-facing angle
- Do NOT allow the subject to look at the camera, do NOT rotate body toward camera
- No front-facing frames, no sudden head turns, no camera shake, no zoom, no reframing
- Camera remains completely fixed
- Prevent hand and finger deformation, prevent hair clipping through arms/body, prevent arms from bending unnaturally
—
BODY MOVEMENT STYLE: minimal torso movement, slight natural shoulder lift while gathering the hair, very subtle hip balance shift, calm feminine movement, no exaggerated posing, no dance movement, maintain the same diagonal body angle throughout the clip
—
HAND & ARM MOVEMENT: both arms move softly and naturally together, elbows remain relaxed and feminine, fingers softly compress and hold the hair realistically, no robotic synchronized motion, no stiff elbows, natural real-time movement only
—
CAMERA: fixed tripod camera, no camera movement, no zoom, no perspective changes, maintain exact original framing and crop
—
REALISM RULES: ultra realistic real-time motion, natural arm weight and physics, realistic shoulder mechanics, realistic fabric response, preserve skin texture, preserve identity, preserve realistic indoor lighting, no beauty filter, no CGI look, no smoothing, no stylization
—

—

VIEWS.prompts={title:'Galeria de Prompts',sub:GALERIA.length+' prompts reais, cada um acompanhado pelo vídeo ou imagem exata correspondente.',html(){
 const q=(S.galQ||'').trim().toLowerCase();
 const cat=S.galCat||'Todos';
 let lista=GALERIA.map((c,i)=>({...c,_i:i}));
 if(cat!=='Todos')lista=lista.filter(c=>c.cat===cat);
 if(q)lista=lista.filter(c=>((c.n||'')+' '+(c.cat||'')).toLowerCase().includes(q));
 return `<div class="gal-wrap">
  <span class="chip-badge">${ico('message',13)} REFERÊNCIA</span>
  <div class="gal-search">
    <input class="input" id="galBusca" placeholder="Buscar prompt..." value="${escAttr(S.galQ||'')}"
           oninput="S.galQ=this.value;nav('prompts')">
    <span class="gal-count">${ico('wrench',14)} ${GALERIA.length} PROMPTS</span>
  </div>
  <div class="gal-cats">
    ${GALERIA_CATS.map(c=>`<button class="chip${c===cat?' on':''}" onclick="S.galCat='${c}';nav('prompts')">${c.toUpperCase()}</button>`).join('')}
  </div>
  ${lista.length?`<div class="gal-grid">${lista.map(c=>{const i=c._i;return `
   <div class="gal-card">
     <div class="gal-stage" id="galst${i}">
       <span class="gal-tag">${(c.cat||'').toUpperCase()}</span>
       ${c.video?`<video data-gi="${i}" muted loop playsinline webkit-playsinline preload="none" disablepictureinpicture></video>
                  <button class="vid-play" onclick="playGaleria(${i})" aria-label="Reproduzir vídeo"><span class="pb">${ico('play',20)}</span></button>`
                :c.img?`<img src="${c.img}" alt="" loading="lazy">`
                :`<div class="vid-ph">${ico('play',26)}<small>Vídeo do prompt ${i+1}</small></div>`}
     </div>
     <div class="gal-body">
       <h4>${c.n||('Prompt '+(i+1))}</h4>
       <button class="btn btn-primary btn-block" onclick="copyGaleria(${i})">${ico('copy',15)} COPIAR PROMPT</button>
     </div>
   </div>`;}).join('')}</div>`
   :`<div class="empty" style="margin-top:20px"><h4>${GALERIA.length?'Nada encontrado':'Galeria vazia por enquanto'}</h4>

function copyGaleria(i){
 const p=GALERIA[i].p;
 if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(p).then(()=>toast('Prompt copiado com sucesso.')).catch(()=>copy(p,'Prompt'));
 }else copy(p,'Prompt');
}
function galeriaSrc(i){
 const c=GALERIA[i];
 if(VIDEO_BASE&&c.video)return VIDEO_BASE+'/'+c.video;
 return c.video||'';
}

/* ===== Motor de vídeo (Galeria + Prompt Modelo UGC) =====
   O iPhone só decodifica poucos vídeos ao mesmo tempo. Se muitos ficam
   carregados, os novos travam no 1º quadro ("parece foto"). Por isso:
   - só carrega o vídeo quando o card chega perto da tela;
   - quando o card sai da tela, o vídeo é DESCARREGADO (libera o decodificador);
   - limite de vídeos ativos ao mesmo tempo;
   - vigia: se o vídeo está visível mas o tempo não anda, recarrega sozinho;
   - ao voltar pro app (ex.: depois de colar o prompt no ChatGPT) retoma os visíveis. */
const VID_MAX_ATIVOS=matchMedia('(max-width:820px)').matches?3:8;
const vidAtivos=new Set();
function liberarVideo(v){
 if(!v)return;
 try{v.pause();}catch(e){}
 if(v.getAttribute('src')){v.removeAttribute('src');try{v.load();}catch(e){}}
 v._ultimoT=-1;v._travas=0;vidAtivos.delete(v);
 const st=v.parentElement;if(st){st.classList.remove('playing');}
}
function liberarVideos(root){
 (root||document).querySelectorAll('video').forEach(liberarVideo);
 vidAtivos.clear();
}
function tocarVideo(v,srcFn){
 const st=v.parentElement;
 if(!v.getAttribute('src')){
   v.muted=true;v.defaultMuted=true;v.playsInline=true;
   v.setAttribute('src',srcFn());v.load();
 }
 vidAtivos.add(v);
 /* respeita o limite: descarrega o mais antigo que não está visível, senão o mais antigo */
 if(vidAtivos.size>VID_MAX_ATIVOS){
   const lista=[...vidAtivos].filter(x=>x!==v);
   const fora=lista.find(x=>!x._visivel)||lista[0];
   liberarVideo(fora);
 }
 const ok=()=>{st.classList.remove('needtap');st.classList.add('playing');};
 const falhou=()=>{
   /* ainda sem dados: tenta de novo quando puder tocar */
   v.addEventListener('canplay',function uma(){v.removeEventListener('canplay',uma);
     if(!v._visivel)return;
     const p2=v.play();if(p2&&p2.then)p2.then(ok).catch(()=>st.classList.add('needtap'));},{once:true});
 };
 const p=v.play();
 if(p&&p.then)p.then(ok).catch(falhou);
}
/* vigia de travamento: roda a cada 2s só enquanto houver vídeo ativo */
setInterval(()=>{
 if(document.hidden)return;
 vidAtivos.forEach(v=>{
   if(!v.isConnected){vidAtivos.delete(v);return;}
   if(!v._visivel)return;
   const st=v.parentElement;
   if(v.paused){const p=v.play();if(p&&p.then)p.then(()=>{st.classList.remove('needtap');st.classList.add('playing');}).catch(()=>{});return;}
   if(!v.paused&&v.readyState>=3&&v.currentTime===v._ultimoT){
     v._travas=(v._travas||0)+1;
     if(v._travas>=2){ /* travou: recarrega do ponto zero */
       const src=v.getAttribute('src');v._travas=0;
       if(src){v.removeAttribute('src');v.load();v.setAttribute('src',src);v.load();
         v.play().catch(()=>st.classList.add('needtap'));}
     }
   }else v._travas=0;
   v._ultimoT=v.currentTime;
 });
},2000);
/* voltar pro app: retoma o que está visível */
function retomarVisiveis(){
 if(document.hidden)return;
 document.querySelectorAll('#view video').forEach(v=>{
   if(v._visivel&&v._srcFn){liberarVideo(v);tocarVideo(v,v._srcFn);}
 });
}
document.addEventListener('visibilitychange',retomarVisiveis);
/* Modo de Pouca Energia do iPhone bloqueia o autoplay até existir um toque na página.
   Qualquer toque/rolagem na tela já dá play em todos os vídeos visíveis. */
function destravarVisiveis(){
 document.querySelectorAll('#view video').forEach(v=>{
   if(!v._visivel||!v.paused||!v._srcFn)return;
   const st=v.parentElement;
   if(!v.getAttribute('src')){v.muted=true;v.setAttribute('src',v._srcFn());v.load();vidAtivos.add(v);}
   const p=v.play();
   if(p&&p.then)p.then(()=>{st.classList.remove('needtap');st.classList.add('playing');}).catch(()=>{});
 });
}
['touchstart','touchend','pointerup','click','keydown'].forEach(ev=>
 document.addEventListener(ev,destravarVisiveis,{capture:true,passive:true}));
window.addEventListener('pageshow',retomarVisiveis);

function observarVideos(seletor,srcDe){
 const vs=document.querySelectorAll(seletor);
 if(!vs.length)return null;
 const io=new IntersectionObserver(es=>es.forEach(e=>{
   const v=e.target;
   v._visivel=e.isIntersecting;
   if(e.isIntersecting){v._srcFn=()=>srcDe(v);tocarVideo(v,v._srcFn);}
   else liberarVideo(v);
 }),{threshold:.25,rootMargin:'120px 0px'});
 vs.forEach(v=>{
   v._srcFn=()=>srcDe(v);
   /* toque no vídeo: se estiver parado, toca */
   v.addEventListener('click',()=>{if(v.paused){v._visivel=true;tocarVideo(v,v._srcFn);}});
   io.observe(v);
 });
 return io;
}

function playGaleria(i){
 const st=$('#galst'+i),v=st&&st.querySelector('video');if(!v)return;
 v._visivel=true;tocarVideo(v,()=>galeriaSrc(i));
}
let galeriaIO=null;
function galeriaWatch(){
 if(galeriaIO){galeriaIO.disconnect();galeriaIO=null;}
 galeriaIO=observarVideos('.gal-stage video[data-gi]',v=>galeriaSrc(+v.dataset.gi));
}



/* ---- início ---- */
aplicarTema();
abrir(location.hash.replace('#','')==='ganchos'?'ganchos':'prompts');
</script>
